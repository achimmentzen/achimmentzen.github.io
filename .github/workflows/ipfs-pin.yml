# Legt bei jeder Änderung den aktuellen Stand der Website auf IPFS
# und pinnt ihn bei mehreren Diensten ("Gezeigtes bleibt gezeigt").
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   PINATA_JWT                         – Pinata API-Key (JWT)
#   FILEBASE_KEY, FILEBASE_SECRET,
#   FILEBASE_BUCKET                    – Filebase IPFS-Bucket + Zugangsschlüssel
# Fehlt ein Secret, wird dieser Dienst einfach übersprungen.
name: IPFS pinnen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    if: "!contains(github.event.head_commit.message, '[archiv]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Galeriebilder verschlüsseln (Bild nur nach Altersabfrage sichtbar)
        run: |
          pip install --quiet cryptography
          python3 tools/galerie_crypt.py
          python3 tools/sitemap.py
          if ! git diff --cached --quiet; then
            git config user.name "Claude"
            git config user.email "noreply@anthropic.com"
            git commit -m "Galeriebilder verschlüsselt (automatisch)"
            git push origin HEAD:main
          fi

      - name: Suchmaschinen benachrichtigen (IndexNow)
        continue-on-error: true
        run: python3 tools/indexnow.py

      - name: Website-Stand vorbereiten
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude '.git' --exclude '.github' ./ /tmp/site/
          echo "SERVICES=" >> "$GITHUB_ENV"

      - name: CAR-Datei erzeugen (CID berechnen)
        run: |
          npm install -g ipfs-car@1
          ipfs-car pack /tmp/site --output /tmp/site.car
          CID=$(ipfs-car roots /tmp/site.car | head -1)
          echo "CID=$CID" >> "$GITHUB_ENV"
          echo "### IPFS-CID: \`$CID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://ipfs.io/ipfs/$CID/" >> "$GITHUB_STEP_SUMMARY"

      - name: Pinata (Ordner-Upload, Gratis-Plan)
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -z "$PINATA_JWT" ]; then echo "Pinata übersprungen (kein Secret)"; exit 0; fi
          python3 - <<'PY'
          import os, json, mimetypes, urllib.request, uuid
          root="/tmp/site"; name="achimmentzen-site-"+os.environ["GITHUB_SHA"][:7]
          b=uuid.uuid4().hex; parts=[]
          for dp,_,fs in os.walk(root):
              for f in sorted(fs):
                  full=os.path.join(dp,f); rel=os.path.relpath(full,root)
                  ct=mimetypes.guess_type(f)[0] or "application/octet-stream"
                  parts.append(f'--{b}\r\nContent-Disposition: form-data; name="file"; filename="{name}/{rel}"\r\nContent-Type: {ct}\r\n\r\n'.encode()+open(full,"rb").read()+b"\r\n")
          for k,v in [("network","public"),("name",name)]:
              parts.append(f'--{b}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode())
          body=b"".join(parts)+f"--{b}--\r\n".encode()
          req=urllib.request.Request("https://uploads.pinata.cloud/v3/files",data=body,headers={"User-Agent":"curl/8.5.0","Authorization":"Bearer "+os.environ["PINATA_JWT"],"Content-Type":"multipart/form-data; boundary="+b})
          try:
              r=urllib.request.urlopen(req,timeout=600); d=json.load(r); print(json.dumps(d)[:800])
          except urllib.error.HTTPError as e:
              print("Pinata HTTP",e.code,e.read()[:800]); raise SystemExit(1)
          cid=d.get("data",{}).get("cid","")
          with open(os.environ["GITHUB_ENV"],"a") as g:
              g.write(f"CID={cid}\nSERVICES=Pinata,\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as g:
              g.write(f"- Pinata: gepinnt, CID {cid} https://ipfs.io/ipfs/{cid}/\n")
          PY

      - name: Filebase
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILEBASE_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILEBASE_SECRET }}
          BUCKET: ${{ secrets.FILEBASE_BUCKET }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$BUCKET" ]; then echo "Filebase übersprungen (kein Secret)"; exit 0; fi
          aws --endpoint-url https://s3.filebase.com s3 cp /tmp/site.car \
            "s3://$BUCKET/achimmentzen-site-${GITHUB_SHA::7}.car" \
            --metadata import=car
          echo "- Filebase: gepinnt" >> "$GITHUB_STEP_SUMMARY"
          echo "SERVICES=${SERVICES}Filebase," >> "$GITHUB_ENV"

      - name: Übersicht (archiv.json) aktualisieren
        if: env.SERVICES != ''
        run: |
          python3 - <<'PY'
          import json, os, datetime
          d = json.load(open('archiv.json'))
          d.append({
            "datum": datetime.date.today().isoformat(),
            "titel": "Website-Stand",
            "cid": os.environ["CID"],
            "pfad": "",
            "commit": os.environ["GITHUB_SHA"][:7],
            "dienste": [x for x in os.environ["SERVICES"].split(",") if x],
          })
          json.dump(d, open('archiv.json', 'w'), ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add archiv.json
          git commit -m "[archiv] IPFS-Stand $CID"
          git push
